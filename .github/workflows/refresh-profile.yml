name: Refresh profile cards

on:
  workflow_dispatch:
  schedule:
    - cron: '23 23 * * *'
  push:
    branches: [main]
    paths:
      - 'profile.json'
      - 'locales.json'
      - 'scripts/**'
      - 'fonts/**'
      - 'assets/**'
      - '.github/workflows/refresh-profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public contribution counts
        run: python3 scripts/refresh_data.py
      - name: Render SVG cards and README
        run: |
          python3 scripts/prepare_chinese_font.py
          python3 scripts/render_cards.py
      - name: Commit refreshed cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cards data fonts README.md README.en.md preview.html preview.en.html
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile cards'
            git push
          fi
